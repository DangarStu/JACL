<IfModule mod_fcgid.c>
  FcgidMaxProcesses 10
  FcgidMaxProcessesPerClass 1
  FcgidIOTimeout 120
  FcgidIdleTimeout 300
  FcgidProcessLifeTime 3600

  ScriptAlias /jacl/ "/usr/local/jacl/fcgi-bin/"

  <Directory "/usr/local/jacl/fcgi-bin">
    SetHandler fcgid-script
    Options +ExecCGI
    Require all granted
  </Directory>

  Alias /www/ "/usr/local/jacl/projects/www/"
  Alias /include/ "/usr/local/jacl/projects/www/"

  <Directory "/usr/local/jacl/projects/www">
    Options -Indexes
    Require all granted
  </Directory>

  Alias /images/ "/usr/local/jacl/projects/images/"

  <Directory "/usr/local/jacl/projects/images">
    Options -Indexes
    Require all granted
  </Directory>
</IfModule>

# ----------------------------------------------------------------------
# iPad download packages (.jaclgame)
#
# A .jaclgame is a ZIP, so with no explicit Content-Type iOS sniffs the
# magic bytes and serves it as a generic .zip -- which the JACL app doesn't
# own, so "Open in JACL" never appears on download. Serve it as an opaque
# binary attachment so Safari keeps the .jaclgame name; the installed app
# then matches it by extension and offers to open it.
# ----------------------------------------------------------------------
<LocationMatch "\.jaclgame$">
  ForceType application/octet-stream
  <IfModule mod_headers.c>
    Header set Content-Disposition "attachment"
  </IfModule>
</LocationMatch>

# ----------------------------------------------------------------------
# Optional: HTTPS vhost for Google Sign-In
#
# Google Identity Services requires the page origin to be HTTPS
# (localhost is the only exception). The session cookie fcgijacl
# emits adds the Secure flag automatically when Apache sets HTTPS=on,
# so wiring up SSL is all that's needed on the Apache side.
#
# Replace jacl.example.com and the certificate paths to suit, then
# point Google Cloud Console -> Credentials -> "Authorised JavaScript
# origins" at the same https://jacl.example.com (no port, no path,
# no trailing slash).
# ----------------------------------------------------------------------
#
# <VirtualHost *:80>
#   ServerName jacl.example.com
#   Redirect permanent / https://jacl.example.com/
# </VirtualHost>
#
# <VirtualHost *:443>
#   ServerName jacl.example.com
#
#   SSLEngine on
#   SSLCertificateFile      /etc/letsencrypt/live/jacl.example.com/fullchain.pem
#   SSLCertificateKeyFile   /etc/letsencrypt/live/jacl.example.com/privkey.pem
#
#   # Recommended hardening once HTTPS is verified working:
#   # Header always set Strict-Transport-Security "max-age=31536000"
#   # Header always set Referrer-Policy "strict-origin-when-cross-origin"
#
#   Include /etc/apache2/conf-available/jacl-apache.conf
# </VirtualHost>
