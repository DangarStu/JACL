# Rotate JACL access.log and error.log in /usr/local/jacl/logs/.
# Installed to /etc/logrotate.d/jacl by `make apache`.
#
# fcgijacl opens the log with fopen("a") and closes on every write, so
# copytruncate is safe and avoids any SIGHUP dance with the FastCGI
# workers. rotate on reaching 10M and keep 7 gzipped archives.

/usr/local/jacl/logs/*.log {
    size 10M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su www-data www-data
    create 664 www-data www-data
}
