# /etc/apache2/sites-available/bastrd-ssl.conf on jacl.dangarmarine.com.au
# (the Dangar Marine VM). Installed by setup-bastrd-site.sh once the
# certificate exists.
#
# Serves the BASTRD app at the root of bastrd.dangarmarine.com.au. The
# /jacl/, /images/ and /www/ paths the page uses come from the server-wide
# conf-enabled/jacl.conf (etc/jacl-apache.conf), so they work here as is.

<VirtualHost *:443>
    ServerName bastrd.dangarmarine.com.au
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/bastrd-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/bastrd-ssl-access.log combined

    RewriteEngine on

    # The tab links are built from $url, which is the script's own path
    # (/jacl/bastrd.fcgi), so send a browser that follows one back to the
    # clean address. THE_REQUEST is the original request line, so the
    # internal rewrite below never triggers this.
    RewriteCond %{THE_REQUEST} "^\S+ /jacl/bastrd\.fcgi[\s?]"
    RewriteRule ^/jacl/bastrd\.fcgi$ / [R=302,L]

    # The site root is the app. PT hands the rewritten path on to the
    # /jacl/ ScriptAlias; the query string (?command=..., ?mode=...) is kept.
    RewriteRule ^/$ /jacl/bastrd.fcgi [PT,L]

    SSLEngine on
    SSLCertificateFile  /etc/letsencrypt/live/bastrd.dangarmarine.com.au/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bastrd.dangarmarine.com.au/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
