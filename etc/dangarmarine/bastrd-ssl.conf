# /etc/apache2/sites-available/bastrd-ssl.conf on jacl.dangarmarine.com.au
# (the Dangar Marine VM). Installed by setup-offside-site.sh.
#
# The app was called BASTRD and lived at bastrd.dangarmarine.com.au until it
# was renamed OFFSIDE. Invite links, bookmarks and shared links still point
# here, so send every request to the same place on the new name, query string
# and all (an ?invite=... link keeps working). Port 80 (bastrd.conf) sends
# everything here first, and still answers certbot so this certificate keeps
# renewing.

<VirtualHost *:443>
    ServerName bastrd.dangarmarine.com.au
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/bastrd-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/bastrd-ssl-access.log combined

    RewriteEngine on

    # The old tab links named the script, /jacl/bastrd.fcgi, which no longer
    # exists: send those to the new site's root (the query string is kept)
    RewriteRule ^/jacl/bastrd\.fcgi$ https://offside.dangarmarine.com.au/ [R=301,L]
    RewriteRule ^/(.*)$ https://offside.dangarmarine.com.au/$1 [R=301,L]

    SSLEngine on
    SSLCertificateFile  /etc/letsencrypt/live/bastrd.dangarmarine.com.au/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bastrd.dangarmarine.com.au/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
