# /etc/apache2/sites-available/bastrd.conf on jacl.dangarmarine.com.au
# (the Dangar Marine VM). Unchanged by the rename to OFFSIDE.
#
# Port 80 for bastrd.dangarmarine.com.au, the app's old name: everything
# goes to HTTPS (where bastrd-ssl.conf redirects it on to
# offside.dangarmarine.com.au) except Let's Encrypt's challenge requests,
# which certbot has to answer over plain HTTP when it renews the
# certificate.

<VirtualHost *:80>
    ServerName bastrd.dangarmarine.com.au
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/bastrd-error.log
    CustomLog ${APACHE_LOG_DIR}/bastrd-access.log combined

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
