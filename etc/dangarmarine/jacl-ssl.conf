# The live copy of /etc/apache2/sites-available/jacl-ssl.conf on
# jacl.dangarmarine.com.au (the Dangar Marine VM), kept here as a record.
#
# JACL's HTTPS site. The fcgi interpreter and the /www/ and /include/
# aliases come from etc/jacl-apache.conf, installed server-wide as
# conf-enabled/jacl.conf. The certificate is certbot's (apache
# authenticator), renewed by certbot.timer.

<VirtualHost *:443>
    ServerName jacl.dangarmarine.com.au

    SSLEngine on

    DocumentRoot    /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/jacl-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/jacl-ssl-access.log combined
    SSLCertificateFile  /etc/letsencrypt/live/jacl.dangarmarine.com.au/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/jacl.dangarmarine.com.au/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
