# /etc/apache2/sites-available/offside.conf on dmsyd1.dangarmarine.com.au
# (the Dangar Marine VM). Installed by setup-offside-site.sh.
#
# Port 80 for offside.dangarmarine.com.au: everything goes to HTTPS except
# Let's Encrypt's challenge requests, which certbot has to answer over
# plain HTTP when it issues and renews the certificate.

<VirtualHost *:80>
    ServerName offside.dangarmarine.com.au
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/offside-error.log
    CustomLog ${APACHE_LOG_DIR}/offside-access.log combined

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
