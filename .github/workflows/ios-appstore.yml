name: iOS — App Store submission

# Submit an ALREADY-UPLOADED TestFlight build for App Store REVIEW (no rebuild,
# no binary upload). Manual only. It first downloads the live listing's metadata
# so the new version inherits the current description/keywords/screenshots
# verbatim, overwrites only "What's New", then submits via fastlane `release`.
# The live (already-released) version is a separate record and is NOT touched.
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Marketing version to submit (must already have a processed build)"
        default: "1.2"
      build_number:
        description: "Build number to attach"
        default: "3"

permissions:
  contents: read

jobs:
  submit:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      # Build the api_key.json deliver's download_metadata CLI needs (the .p8 is a
      # base64 secret; decode it into the "key" field).
      - name: Write ASC API key json
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, json, base64
          out = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": base64.b64decode(os.environ["ASC_KEY_P8_BASE64"]).decode(),
              "duration": 1200,
              "in_house": False,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "asc_api_key.json"), "w") as f:
              json.dump(out, f)
          PY

      # Pull the LIVE listing's metadata so the new version's description/keywords
      # stay identical. Only text metadata is downloaded; screenshots are skipped.
      - name: Download live metadata
        run: |
          bundle exec fastlane deliver download_metadata \
            --app_identifier au.com.dangarmarine.JACL \
            --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --use_live_version true \
            --metadata_path fastlane/metadata

      - name: Set "What's New" for every locale
        run: |
          NOTES="The on-screen keyboard now stays up between commands instead of flickering away and back after each one. Default text margins on phones are tighter for easier reading, plus minor stability fixes."
          shopt -s nullglob
          for d in fastlane/metadata/*/; do
            [ -f "${d}description.txt" ] || continue   # only real locale dirs
            printf '%s' "$NOTES" > "${d}release_notes.txt"
            echo "  set release notes for $d"
          done

      - name: Submit for review
        run: bundle exec fastlane release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APP_VERSION: ${{ inputs.app_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
