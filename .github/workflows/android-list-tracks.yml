name: Android — list Play tracks (diagnostic)

# One-off diagnostic: lists the app's Play track identifiers using the service
# account, so we can find the closed-testing track id. Safe — read-only, no upload.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-tracks:
    runs-on: ubuntu-latest
    steps:
      - name: List Play tracks
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, time, base64

          sa = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          pkg = "au.com.dangarmarine.jacl"

          # --- mint an OAuth access token from the service-account key (JWT bearer) ---
          import hashlib
          try:
              from cryptography.hazmat.primitives import hashes, serialization
              from cryptography.hazmat.primitives.asymmetric import padding
          except ImportError:
              os.system("pip install --quiet cryptography")
              from cryptography.hazmat.primitives import hashes, serialization
              from cryptography.hazmat.primitives.asymmetric import padding

          def b64url(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=")

          now = int(time.time())
          header = {"alg": "RS256", "typ": "JWT"}
          claim = {
              "iss": sa["client_email"],
              "scope": "https://www.googleapis.com/auth/androidpublisher",
              "aud": "https://oauth2.googleapis.com/token",
              "iat": now,
              "exp": now + 3600,
          }
          signing_input = b64url(json.dumps(header).encode()) + b"." + b64url(json.dumps(claim).encode())
          key = serialization.load_pem_private_key(sa["private_key"].encode(), password=None)
          sig = key.sign(signing_input, padding.PKCS1v15(), hashes.SHA256())
          assertion = (signing_input + b"." + b64url(sig)).decode()

          data = urllib.parse.urlencode({
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion": assertion,
          }).encode()
          tok = json.loads(urllib.request.urlopen(
              urllib.request.Request("https://oauth2.googleapis.com/token", data=data)).read())
          access = tok["access_token"]

          base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{pkg}"
          def api(method, path, body=None):
              req = urllib.request.Request(base + path, method=method,
                  headers={"Authorization": f"Bearer {access}", "Content-Type": "application/json"},
                  data=json.dumps(body).encode() if body is not None else None)
              return json.loads(urllib.request.urlopen(req).read())

          edit = api("POST", "/edits")
          eid = edit["id"]
          tracks = api("GET", f"/edits/{eid}/tracks")
          print("=== TRACKS ===")
          for t in tracks.get("tracks", []):
              releases = t.get("releases", [])
              codes = [r.get("versionCodes") for r in releases]
              statuses = [r.get("status") for r in releases]
              print(f"track={t.get('track')!r}  releases_status={statuses}  versionCodes={codes}")
          print("=== RAW ===")
          print(json.dumps(tracks, indent=2))
          PY
