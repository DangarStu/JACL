name: Android — list Play tracks (diagnostic)

# Read-only: lists the app's Play tracks (their API identifiers, releases, version
# codes and country targeting) via the Play Developer API, so a release can be
# pushed to the correct closed-testing track. Does not modify anything (it opens
# an edit transaction only to read tracks, then deletes it).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List tracks
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth requests
          python3 - <<'PY'
          import os, json
          import google.auth.transport.requests
          from google.oauth2 import service_account
          import requests
          info = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/androidpublisher"])
          creds.refresh(google.auth.transport.requests.Request())
          h = {"Authorization": f"Bearer {creds.token}"}
          pkg = "au.com.dangarmarine.jacl"
          base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{pkg}"
          eid = requests.post(f"{base}/edits", headers=h).json()["id"]
          tracks = requests.get(f"{base}/edits/{eid}/tracks", headers=h).json()
          for t in tracks.get("tracks", []):
              print("TRACK id:", t.get("track"))
              for r in t.get("releases", []):
                  ct = r.get("countryTargeting")
                  print("   release:", r.get("name"), "| status:", r.get("status"),
                        "| versionCodes:", r.get("versionCodes"),
                        "| countries:", (len(ct.get("countries", [])) if ct else "track-level/none"))
          requests.delete(f"{base}/edits/{eid}", headers=h)
          PY
