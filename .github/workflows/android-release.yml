name: Android — Play internal

# Runs on an `android-v*` tag (e.g. `git tag android-v1.3 && git push origin
# android-v1.3`) or manually from the Actions tab. Needs the secrets in
# STORE_AUTOMATION.md, and the app must have had one manual .aab upload in the Play
# Console first. (Won't run until you push such a tag.)
on:
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Play track to upload to (e.g. internal, alpha for closed testing)'
        required: false
        default: 'internal'
  push:
    tags: ['android-v*']

permissions:
  contents: read

jobs:
  internal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Recreate the (gitignored) upload keystore + keystore.properties from secrets
      # so :app:bundleRelease produces a signed AAB. storeFile is resolved relative
      # to android/ (the Gradle root).
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > jacl-release.jks
          cat > keystore.properties <<EOF
          storeFile=jacl-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # 1000 + run number: unique, increasing versionCode that also clears any
      # versionCodes already used in earlier (manual) Play uploads.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: android

      - name: Build & upload to the Play track
        run: bundle exec fastlane internal
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          PLAY_TRACK: ${{ github.event.inputs.play_track || 'internal' }}
