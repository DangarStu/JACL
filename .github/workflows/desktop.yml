name: Desktop builds

# Cross-platform installers for the JACL Electron desktop app. cgijacl (the engine)
# is C, compiled per-OS on its own runner; jpp compiles the published games; then
# electron-builder packages the app. workflow_dispatch yields the installers as
# Artifacts; a `desktop-v*` tag also publishes them to a GitHub Release.
# (Tags are namespaced: ios-v*/android-v* are the store pipelines; desktop-v* is this.)
#
# Windows is NOT built yet: cgijacl's built-in web server (webjacl.c) is POSIX C and
# needs a Windows port or a mingw build first. See desktop/PLAN.md.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write   # a tag build creates/attaches the GitHub Release

jobs:
  package:
    name: ${{ matrix.target }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    # 'true' only when the Developer ID cert secret exists; gates the mac
    # signing/notarization steps so builds stay green until MAC_CSC_LINK is added.
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CSC_LINK != '' }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # cgijacl links jansson / openssl / libcurl (see build-cgijacl.sh).
      - name: Install engine build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install jansson openssl@3 curl
      - name: Install engine build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config fakeroot \
            libjansson-dev libssl-dev libcurl4-openssl-dev

      - name: Install npm deps
        run: npm ci

      # macOS notarization key — reuses the App Store Connect API key already in
      # secrets (shared with the iOS pipeline). Only when the signing cert exists,
      # so unsigned builds never try to notarize.
      - name: Prepare macOS signing + notarization
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        run: |
          KEY="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          P12="$RUNNER_TEMP/dev_id.p12"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$P12"
          {
            echo "APPLE_API_KEY=$KEY"
            echo "APPLE_API_KEY_ID=$ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID"
            echo "CSC_LINK=$P12"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      # dist:<target> = build cgijacl -> compile+stage published games -> electron-builder.
      # With a cert, the gated step above sets CSC_LINK/CSC_KEY_PASSWORD (so they're truly
      # ABSENT without one) and AUTO_DISCOVERY=true → sign + notarize. With no cert they're
      # unset and AUTO_DISCOVERY=false → a clean UNSIGNED build. All ignored by the Linux job.
      - name: Build engine + games and package
        run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_MAC_CERT }}

      - uses: actions/upload-artifact@v4
        with:
          name: jacl-desktop-${{ matrix.target }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: warn

      # On a desktop-v* tag, attach this OS's installers to the GitHub Release.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          fail_on_unmatched_files: false
          generate_release_notes: true

  # Publish/refresh a signed APT repository on the gh-pages branch so Debian/Ubuntu
  # users can `apt install jacl-desktop`. Runs after the build, on a desktop-v* tag.
  # The repo signing key is in the APT_GPG_PRIVATE_KEY secret (public key committed
  # at desktop/apt/jacl.gpg). One-time: enable Pages on the gh-pages branch.
  apt-repo:
    name: Publish APT repo
    needs: package
    # always() so a flaky mac notarization doesn't block publishing the Linux .deb
    # (this job only needs the linux artifact); the download fails harmlessly if linux didn't build.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v4            # for desktop/apt/jacl.gpg

      - name: Download the Linux build (.deb)
        uses: actions/download-artifact@v4
        with:
          name: jacl-desktop-linux
          path: incoming

      - name: Install apt tooling + import signing key
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}

      - name: Build + publish the signed APT repo
        env:
          KEY_FPR: 50EBC4C2EBD182EF36AA21AD37874D532601DA28
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          # Reuse the existing gh-pages pool (keep old versions), or start fresh.
          if git clone --depth 1 --branch gh-pages "$REMOTE" ghp 2>/dev/null; then
            echo "reusing existing gh-pages"
          else
            git clone --depth 1 "$REMOTE" ghp
            ( cd ghp && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true )
          fi
          mkdir -p ghp/pool/main ghp/dists/stable/main/binary-amd64
          cp incoming/*.deb ghp/pool/main/
          cp desktop/apt/jacl.gpg ghp/jacl.gpg
          echo "apt.dangarmarine.com.au" > ghp/CNAME   # Pages custom domain (persist across pushes)
          touch ghp/.nojekyll                 # serve dists/ + pool/ verbatim (no Jekyll)
          cat > ghp/index.html <<'HTML'
          <!doctype html><meta charset=utf-8><title>JACL desktop — APT repo</title>
          <body style="font-family:system-ui;max-width:48rem;margin:3rem auto;padding:0 1rem">
          <h1>JACL desktop — Debian/Ubuntu (apt)</h1>
          <pre style="background:#111;color:#eee;padding:1rem;border-radius:8px;overflow:auto">
          curl -fsSL https://apt.dangarmarine.com.au/jacl.gpg | sudo gpg --dearmor -o /usr/share/keyrings/jacl.gpg
          echo "deb [signed-by=/usr/share/keyrings/jacl.gpg] https://apt.dangarmarine.com.au stable main" | sudo tee /etc/apt/sources.list.d/jacl.list
          sudo apt update &amp;&amp; sudo apt install jacl-desktop</pre>
          <p>Other Linux: the <code>.AppImage</code> on the
          <a href="https://github.com/DangarStu/JACL/releases">Releases page</a> runs anywhere, no install.</p>
          </body>
          HTML
          cd ghp
          dpkg-scanpackages --multiversion pool/main > dists/stable/main/binary-amd64/Packages
          gzip -9 -kf dists/stable/main/binary-amd64/Packages
          ( cd dists/stable
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin=JACL \
              -o APT::FTPArchive::Release::Label=JACL \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              -o APT::FTPArchive::Release::Components=main \
              -o APT::FTPArchive::Release::Architectures=amd64 \
              release . > Release
            gpg --batch --yes --local-user "$KEY_FPR" -abs -o Release.gpg Release
            gpg --batch --yes --local-user "$KEY_FPR" --clearsign -o InRelease Release
          )
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apt: publish ${REF}" || { echo "no changes"; exit 0; }
          git push "$REMOTE" gh-pages
