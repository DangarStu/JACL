name: iOS — diagnose Invalid Binary (read-only ASC API)

# READ-ONLY diagnostic. Answers the question: is the SUBMITTED 1.2 App Store
# version actually invalid, or is build 1011 VALID and the "Invalid Binary" the
# user sees just an old/stale build in the list? This workflow only issues GET
# requests — it never PATCHes, submits, or edits any metadata.
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Marketing version to inspect"
        default: "1.2"
      build_number:
        description: "Build number to inspect"
        default: "1011"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query ASC API (read-only)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APP_VERSION: ${{ inputs.app_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          APP_ID: "6780354110"
          BUNDLE_ID: au.com.dangarmarine.JACL
        run: |
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, sys, time, json, base64
          import jwt
          import requests

          KEY_ID      = os.environ["ASC_KEY_ID"]
          ISSUER_ID   = os.environ["ASC_ISSUER_ID"]
          PRIVATE_KEY = base64.b64decode(os.environ["ASC_KEY_P8_BASE64"]).decode()
          APP_ID      = os.environ["APP_ID"]
          APP_VERSION = os.environ["APP_VERSION"]
          BUILD_NUMBER = os.environ["BUILD_NUMBER"]

          BASE = "https://api.appstoreconnect.apple.com"

          # ES256 JWT, 20-min expiry, aud appstoreconnect-v1.
          now = int(time.time())
          token = jwt.encode(
              {
                  "iss": ISSUER_ID,
                  "iat": now,
                  "exp": now + 20 * 60,
                  "aud": "appstoreconnect-v1",
              },
              PRIVATE_KEY,
              algorithm="ES256",
              headers={"kid": KEY_ID, "typ": "JWT"},
          )
          HEADERS = {"Authorization": f"Bearer {token}"}

          def get(label, path, params=None, quiet=False):
              r = requests.get(f"{BASE}{path}", headers=HEADERS, params=params)
              if not quiet:
                  print(f"\n=== {label} -> HTTP {r.status_code} ===")
                  body = r.text
                  try:
                      body = json.dumps(r.json(), indent=2)
                  except Exception:
                      pass
                  print(body)
              return r

          findings = {}

          # 1. The 1.2 appStoreVersion: its appStoreState and pointed-to build.
          r = get("GET appStoreVersions (1.2)",
                  f"/v1/apps/{APP_ID}/appStoreVersions",
                  {"filter[versionString]": APP_VERSION, "limit": 50})
          versions = r.json().get("data", [])
          one_two = None
          for v in versions:
              if v["attributes"].get("versionString") == APP_VERSION:
                  one_two = v
                  break
          if one_two is None and versions:
              one_two = versions[0]

          version_state = None
          pointed_build_no = None
          if one_two:
              version_id = one_two["id"]
              version_state = one_two["attributes"].get("appStoreState")
              findings["1.2 appStoreState"] = version_state
              print(f"\n1.2 version id = {version_id}  appStoreState = {version_state}")

              # Which build does the submitted 1.2 point to?
              rb = get("GET appStoreVersions/{id}/relationships/build",
                       f"/v1/appStoreVersions/{version_id}/relationships/build")
              bdata = rb.json().get("data")
              if bdata:
                  build_ref_id = bdata["id"]
                  rbf = get("GET pointed-to build detail",
                            f"/v1/builds/{build_ref_id}")
                  battr = rbf.json().get("data", {}).get("attributes", {})
                  pointed_build_no = battr.get("version")
                  findings["1.2 points to build #"] = pointed_build_no
                  findings["pointed build processingState"] = battr.get("processingState")
                  findings["pointed build expired"] = battr.get("expired")
              else:
                  findings["1.2 points to build #"] = "(none / null relationship)"
          else:
              findings["1.2 appStoreState"] = "(no 1.2 version found)"

          # 2. Build BUILD_NUMBER processingState + validation/expiration info.
          r = get(f"GET build {BUILD_NUMBER}",
                  "/v1/builds",
                  {"filter[app]": APP_ID, "filter[version]": BUILD_NUMBER, "limit": 50})
          target_builds = r.json().get("data", [])
          if target_builds:
              b = target_builds[0]
              a = b["attributes"]
              findings[f"build {BUILD_NUMBER} processingState"] = a.get("processingState")
              findings[f"build {BUILD_NUMBER} expired"] = a.get("expired")
              findings[f"build {BUILD_NUMBER} expirationDate"] = a.get("expirationDate")
              findings[f"build {BUILD_NUMBER} uploadedDate"] = a.get("uploadedDate")
              findings[f"build {BUILD_NUMBER} version(string)"] = a.get("version")
          else:
              findings[f"build {BUILD_NUMBER} processingState"] = "(not found)"

          # 3. All recent builds for the app, with processingState + expired.
          r = get("GET all recent builds",
                  "/v1/builds",
                  {"filter[app]": APP_ID, "limit": 50,
                   "sort": "-uploadedDate"})
          all_builds = r.json().get("data", [])
          build_table = []
          for b in all_builds:
              a = b["attributes"]
              build_table.append((
                  a.get("version"),
                  a.get("processingState"),
                  a.get("expired"),
                  a.get("uploadedDate"),
              ))

          # 4. reviewSubmissions with state.
          r = get("GET reviewSubmissions",
                  "/v1/reviewSubmissions",
                  {"filter[app]": APP_ID, "limit": 50})
          subs = r.json().get("data", [])
          sub_table = []
          for s in subs:
              a = s["attributes"]
              sub_table.append((s["id"], a.get("state"), a.get("platform"),
                                a.get("submittedDate")))

          # ---------------- SUMMARY ----------------
          print("\n================ SUMMARY ================")
          print("[1] Submitted 1.2 App Store version:")
          print(f"    appStoreState              : {findings.get('1.2 appStoreState')}")
          print(f"    points to build #          : {findings.get('1.2 points to build #')}")
          print(f"    pointed build state        : {findings.get('pointed build processingState')}")
          print(f"    pointed build expired      : {findings.get('pointed build expired')}")

          print(f"\n[2] Build {BUILD_NUMBER}:")
          print(f"    processingState            : {findings.get(f'build {BUILD_NUMBER} processingState')}")
          print(f"    expired                    : {findings.get(f'build {BUILD_NUMBER} expired')}")
          print(f"    expirationDate             : {findings.get(f'build {BUILD_NUMBER} expirationDate')}")
          print(f"    uploadedDate               : {findings.get(f'build {BUILD_NUMBER} uploadedDate')}")

          print(f"\n[3] All recent builds (version | processingState | expired | uploaded):")
          for ver, ps, exp, up in build_table:
              print(f"    {str(ver):>6} | {str(ps):<10} | expired={exp} | {up}")

          print(f"\n[4] reviewSubmissions (id | state | platform | submitted):")
          for sid, st, plat, sub in sub_table:
              print(f"    {sid} | {st} | {plat} | {sub}")

          # ---------------- VERDICT ----------------
          print("\n================ VERDICT ================")
          v_state = findings.get("1.2 appStoreState")
          pointed = findings.get("1.2 points to build #")
          pointed_state = findings.get("pointed build processingState")
          b1011_state = findings.get(f"build {BUILD_NUMBER} processingState")

          if v_state in ("WAITING_FOR_REVIEW", "READY_FOR_REVIEW", "IN_REVIEW",
                         "PENDING_DEVELOPER_RELEASE", "PROCESSING_FOR_APP_STORE"):
              print(f"The SUBMITTED 1.2 version is in state {v_state} and points to "
                    f"build {pointed} (processingState {pointed_state}).")
              if pointed_state == "VALID" or b1011_state == "VALID":
                  print(f"Build {BUILD_NUMBER} processingState is {b1011_state}. "
                        "The submitted version is NOT invalid; the 'Invalid Binary' "
                        "the user sees is a STALE/OLD build's status in the list, not "
                        "the submitted version.")
              else:
                  print(f"WARNING: the build the submitted version points to is "
                        f"{pointed_state}.")
          elif v_state == "INVALID_BINARY":
              print(f"The submitted 1.2 version IS in INVALID_BINARY state, pointing "
                    f"to build {pointed} ({pointed_state}). This is a real problem.")
          else:
              print(f"1.2 appStoreState = {v_state}; pointed build {pointed} "
                    f"({pointed_state}); build {BUILD_NUMBER} = {b1011_state}. "
                    "See tables above.")
          print("=========================================")
          sys.exit(0)
          PY
