name: iOS — set App Store version build (raw ASC API)

# Standalone repair workflow. The ASC UI is locked on an invalid build and
# `deliver` re-attach fails its version-state check, so this PATCHes the build
# relationship of the editable 1.2 App Store version directly via the App Store
# Connect API. It does NOT submit, delete the version, or touch any other
# metadata — only the build relationship.
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Marketing version whose build to set"
        default: "1.2"
      build_number:
        description: "Build number to attach"
        default: "1011"

permissions:
  contents: read

jobs:
  set-build:
    runs-on: ubuntu-latest
    steps:
      - name: Set selected build via ASC API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APP_VERSION: ${{ inputs.app_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUNDLE_ID: au.com.dangarmarine.JACL
        run: |
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, sys, time, json, base64
          import jwt
          import requests

          KEY_ID    = os.environ["ASC_KEY_ID"]
          ISSUER_ID = os.environ["ASC_ISSUER_ID"]
          PRIVATE_KEY = base64.b64decode(os.environ["ASC_KEY_P8_BASE64"]).decode()
          BUNDLE_ID = os.environ["BUNDLE_ID"]
          APP_VERSION = os.environ["APP_VERSION"]
          BUILD_NUMBER = os.environ["BUILD_NUMBER"]

          BASE = "https://api.appstoreconnect.apple.com"

          # 1. ES256 JWT, 20-min expiry, aud appstoreconnect-v1.
          now = int(time.time())
          token = jwt.encode(
              {
                  "iss": ISSUER_ID,
                  "iat": now,
                  "exp": now + 20 * 60,
                  "aud": "appstoreconnect-v1",
              },
              PRIVATE_KEY,
              algorithm="ES256",
              headers={"kid": KEY_ID, "typ": "JWT"},
          )
          HEADERS = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }

          def show(label, r):
              print(f"\n=== {label} -> HTTP {r.status_code} ===")
              body = r.text
              try:
                  body = json.dumps(r.json(), indent=2)
              except Exception:
                  pass
              print(body)
              return r

          # 2. App id by bundle id.
          r = show("GET app",
              requests.get(f"{BASE}/v1/apps",
                  headers=HEADERS,
                  params={"filter[bundleId]": BUNDLE_ID}))
          apps = r.json().get("data", [])
          if not apps:
              sys.exit(f"No app found for bundle id {BUNDLE_ID}")
          app_id = apps[0]["id"]
          print(f"app_id = {app_id}")

          # 3. App Store versions for this version string.
          r = show("GET appStoreVersions",
              requests.get(f"{BASE}/v1/apps/{app_id}/appStoreVersions",
                  headers=HEADERS,
                  params={"filter[versionString]": APP_VERSION}))
          versions = r.json().get("data", [])

          EDITABLE = {
              "PREPARE_FOR_SUBMISSION",
              "DEVELOPER_REJECTED",
              "REJECTED",
              "INVALID_BINARY",
              "METADATA_REJECTED",
          }
          editable = None
          print("\nVersions found:")
          for v in versions:
              state = v["attributes"].get("appStoreState")
              print(f"  id={v['id']} state={state}")
              if editable is None and state in EDITABLE:
                  editable = v
          if editable is None:
              # Fall back to whatever 1.2 version exists, but flag it.
              print("\nWARNING: no version in a known-editable state.")
              if versions:
                  editable = versions[0]
          if editable is None:
              sys.exit(f"No App Store version found for {APP_VERSION}")
          version_id = editable["id"]
          version_state = editable["attributes"].get("appStoreState")
          print(f"\nSelected version id = {version_id}  state = {version_state}")

          # 4. Find build BUILD_NUMBER for this app + pre-release version.
          r = show("GET builds (filtered)",
              requests.get(f"{BASE}/v1/builds",
                  headers=HEADERS,
                  params={
                      "filter[app]": app_id,
                      "filter[preReleaseVersion.version]": APP_VERSION,
                      "filter[version]": BUILD_NUMBER,
                      "limit": 200,
                  }))
          builds = r.json().get("data", [])
          if not builds:
              # Broader fallback: list builds for the app and match version string.
              r = show("GET builds (fallback list)",
                  requests.get(f"{BASE}/v1/builds",
                      headers=HEADERS,
                      params={"filter[app]": app_id, "limit": 200}))
              builds = [b for b in r.json().get("data", [])
                        if b["attributes"].get("version") == BUILD_NUMBER]
          if not builds:
              sys.exit(f"No build {BUILD_NUMBER} found for {APP_VERSION}")
          build = builds[0]
          build_id = build["id"]
          processing = build["attributes"].get("processingState")
          print(f"\nBuild {BUILD_NUMBER} id = {build_id}  processingState = {processing}")
          if processing != "VALID":
              print(f"WARNING: build processingState is {processing}, not VALID.")

          # 5. PATCH the build relationship.
          r = show("PATCH appStoreVersions/{id}/relationships/build",
              requests.patch(
                  f"{BASE}/v1/appStoreVersions/{version_id}/relationships/build",
                  headers=HEADERS,
                  data=json.dumps({"data": {"type": "builds", "id": build_id}})))

          print("\n================ SUMMARY ================")
          print(f"version 1.2 appStoreState : {version_state}")
          print(f"build {BUILD_NUMBER} processingState : {processing}")
          if r.status_code == 204:
              print(f"PATCH result              : SUCCESS (HTTP 204)")
          else:
              print(f"PATCH result              : FAILED (HTTP {r.status_code})")
              print("API said:")
              print(r.text)
          print("========================================")

          sys.exit(0 if r.status_code == 204 else 1)
          PY
