name: iOS — status check (read-only)

# Read-only ASC API probe: reports the App Store version states (is 1.3 live?)
# and the external TestFlight group's public link + whether any build in it has
# passed Beta App Review (i.e. is installable by external testers). Pure GETs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query ASC
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          BUNDLE_ID: au.com.dangarmarine.JACL
        run: |
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, base64, jwt, requests
          KID=os.environ["ASC_KEY_ID"]; ISS=os.environ["ASC_ISSUER_ID"]
          KEY=base64.b64decode(os.environ["ASC_KEY_P8_BASE64"]).decode()
          BUNDLE=os.environ["BUNDLE_ID"]; BASE="https://api.appstoreconnect.apple.com"
          now=int(time.time())
          tok=jwt.encode({"iss":ISS,"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"},
                         KEY,algorithm="ES256",headers={"kid":KID,"typ":"JWT"})
          H={"Authorization":f"Bearer {tok}"}
          app=requests.get(f"{BASE}/v1/apps",headers=H,
                           params={"filter[bundleId]":BUNDLE}).json()["data"][0]
          aid=app["id"]; print("APP:",app["attributes"]["name"],aid)
          print("\n== APP STORE VERSIONS ==")
          for v in requests.get(f"{BASE}/v1/apps/{aid}/appStoreVersions",
                                headers=H,params={"limit":10}).json().get("data",[]):
              a=v["attributes"]
              print("  VERSION",a.get("versionString"),"-> STATE",a.get("appStoreState"))
          print("\n== EXTERNAL TESTFLIGHT GROUPS ==")
          for g in requests.get(f"{BASE}/v1/apps/{aid}/betaGroups",
                                headers=H,params={"limit":200}).json().get("data",[]):
              a=g["attributes"]
              if a.get("isInternalGroup"): continue
              print(f"  GROUP {a.get('name')!r} publicLinkEnabled={a.get('publicLinkEnabled')}")
              print(f"    LINK {a.get('publicLink')}")
              gid=g["id"]
              blds=requests.get(f"{BASE}/v1/betaGroups/{gid}/builds",
                                headers=H,params={"limit":200}).json().get("data",[])
              print(f"    builds in group: {len(blds)}")
              for b in blds:
                  ba=b["attributes"]; bid=b["id"]
                  rev=requests.get(f"{BASE}/v1/builds/{bid}/betaAppReviewSubmission",
                                   headers=H).json()
                  rstate=(rev.get("data") or {}).get("attributes",{}).get("betaReviewState")
                  print(f"      BUILD {ba.get('version')} processing={ba.get('processingState')} "
                        f"expired={ba.get('expired')} betaReview={rstate}")
          PY
