# project.yml --- XcodeGen spec for the JACL iPad app.
#
#   brew install xcodegen      # one-time
#   cd ios && xcodegen generate
#   open JACL.xcodeproj
#
# Regenerable: JACL.xcodeproj and JACL/Info.plist are produced from this file
# and are git-ignored. project.yml is the source of truth.
#
# The target compiles the iOS startup shim + bridge, the unmodified JACL core
# from ../src, and vendored RemGlk (minus its glkstart.c sample and the
# #included cgunigen.c), linked behind a SwiftUI front-end.

name: JACL

options:
  bundleIdPrefix: au.com.dangarmarine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    GCC_C_LANGUAGE_STANDARD: gnu2x   # the core builds with -std=gnu23 on desktop
  configs:
    debug:
      # Define DEBUG so `#if DEBUG` code (e.g. the -autocommands test hook) is
      # compiled in debug builds. xcodegen doesn't add this by default.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

schemes:
  JACL:
    # A shared scheme so `xcodebuild -scheme JACL ... archive` works (archiving
    # requires a scheme; xcodegen doesn't create one by default).
    build:
      targets:
        JACL: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  JACL:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      # SwiftUI front-end (exclude the generated Info.plist from the build).
      - path: JACL
        excludes:
          - "Info.plist"

      # Games bundled with the app (.jaclgame packages copied into Resources;
      # seeded into Documents on first launch by installBundledStarters()).
      - path: StarterGames

      # iOS-only C: startup shim + Swift<->RemGlk bridge + Ogg decoding
      # (jacl_audio.c #includes stb_vorbis.c, so stb_vorbis is not listed).
      - path: ios_startup.c
      - path: jacl_bridge.c
      - path: jacl_audio.c

      # The unmodified JACL interpreter core (same list as src/Makefile's
      # COMMON_SRC, plus jacl.c and the Glk saver). glk_startup.c is NOT
      # included -- ios_startup.c replaces it.
      - path: ../src
        name: core
        includes:
          - "jacl.c"
          - "findroute.c"
          - "interpreter.c"
          - "loader.c"
          - "logging.c"
          - "parser.c"
          - "display.c"
          - "utils.c"
          - "jpp.c"
          - "resolvers.c"
          - "errors.c"
          - "encapsulate.c"
          - "libcsv.c"
          - "glk_saver.c"

      # Vendored RemGlk. glkstart.c is its sample start-up (we supply our
      # own); cgunigen.c is #included by cgunicod.c, not compiled alone.
      - path: remglk
        name: remglk
        includes:
          - "*.c"
        excludes:
          - "glkstart.c"
          - "cgunigen.c"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.dangarmarine.JACL
        TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
        SUPPORTS_MACCATALYST: "YES"          # also build a real Mac app
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"  # same bundle id on Mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # JACL/Assets.xcassets
        SWIFT_OBJC_BRIDGING_HEADER: JACL/JACL-Bridging-Header.h
        GCC_PREPROCESSOR_DEFINITIONS:
          - "GLK=1"
          - "NATIVE_LANGUAGE=1"
          - "JACL_IOS_EMBED=1"               # renames remglk main(); glk_exit -> pthread_exit
          - "$(inherited)"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)"                 # jacl_bridge.h, jacl_ios.h
          - "$(PROJECT_DIR)/../src"          # jacl.h, language.h, "glkterm/glk.h"
          - "$(PROJECT_DIR)/../src/glkterm"  # Glk API headers (ABI-compatible)
          - "$(PROJECT_DIR)/remglk"          # RemGlk internal headers
          - "$(inherited)"
        OTHER_CFLAGS:
          - "-Wno-unused-result"
          - "-Wno-unused-but-set-variable"
          - "-Wno-deprecated-declarations"
          # The JACL C core + vendored RemGlk/libcsv trip clang's stricter
          # checks (the desktop gcc build tolerates them). Quiet the noise in
          # the iOS build; a real 64->32 truncation audit is a separate job.
          - "-Wno-shorten-64-to-32"
          - "-Wno-comma"
          - "-Wno-macro-redefined"

    info:
      path: JACL/Info.plist
      properties:
        CFBundleDisplayName: JACL
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        # Allow secondary windows (the Mac map / settings windows). Without this
        # openWindow() silently no-ops -- the app is treated as single-window.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # No non-exempt encryption: the .j2 XOR-obfuscation isn't cryptographic
        # data protection. Declaring this skips the export-compliance question
        # on every App Store Connect upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        # iPhone: portrait + both landscapes (no upside-down, per convention).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: JACL Game
            LSHandlerRank: Owner
            LSItemContentTypes:
              - au.com.dangarmarine.jacl.j2
              - au.com.dangarmarine.jacl.jaclgame
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: au.com.dangarmarine.jacl.j2
            UTTypeDescription: JACL Game
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - j2
          - UTTypeIdentifier: au.com.dangarmarine.jacl.jaclgame
            UTTypeDescription: JACL Game Package
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - jaclgame
              public.mime-type:
                - application/x-jaclgame
